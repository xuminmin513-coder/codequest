<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';">
  <title>CodeQuest - 编程冒险</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div class="app-container">
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">⌨️</span>
        <span class="logo-text">CodeQuest</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" data-page="dashboard">
          <span class="nav-icon">🏠</span>
          <span data-lang-zh="仪表盘" data-lang-en="Dashboard">仪表盘</span>
        </div>
        <div class="nav-item" data-page="courses">
          <span class="nav-icon">🗺️</span>
          <span data-lang-zh="课程地图" data-lang-en="Courses">课程地图</span>
        </div>
        <div class="nav-item" data-page="achievements">
          <span class="nav-icon">🏅</span>
          <span data-lang-zh="成就徽章" data-lang-en="Achievements">成就徽章</span>
        </div>
        <div class="nav-item" data-page="settings">
          <span class="nav-icon">⚙️</span>
          <span data-lang-zh="设置" data-lang-en="Settings">设置</span>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-level-badge">
          <span class="level-icon">🌟</span>
          <span>Python 冒险</span>
        </div>
        <div class="lang-toggle" id="lang-toggle" onclick="APP.toggleLanguage()">中</div>
      </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">

      <!-- Dashboard Page -->
      <div class="page active" id="page-dashboard">
        <div class="dashboard-header">
          <div class="dashboard-title">
            <h1 id="dash-title">欢迎回来，冒险者！</h1>
            <p id="dash-subtitle">继续你的Python学习之旅</p>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value" id="stat-xp">0</div>
              <div class="stat-label">XP</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-level">1</div>
              <div class="stat-label" data-lang-zh="等级" data-lang-en="Level">等级</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-streak">0d</div>
              <div class="stat-label" data-lang-zh="连续学习" data-lang-en="Streak">连续学习</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-completed">0/0</div>
              <div class="stat-label" data-lang-zh="已完成" data-lang-en="Done">已完成</div>
            </div>
          </div>
        </div>

        <div class="level-progress-card">
          <div class="level-header">
            <span class="level-title" id="level-display">等级 1</span>
            <span class="level-xp" id="xp-display">0 / 500 XP</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="level-bar" style="width: 0%"></div>
          </div>
        </div>

        <h2 class="section-title">
          <span id="streak-flame">🔥</span>
          <span data-lang-zh="快捷入口" data-lang-en="Quick Actions">快捷入口</span>
        </h2>
        <div class="quick-actions" id="quick-actions"></div>
      </div>

      <!-- Courses Page -->
      <div class="page" id="page-courses">
        <h2 class="section-title">🗺️ <span data-lang-zh="课程地图" data-lang-en="Course Map">课程地图</span></h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 14px;">
          <span data-lang-zh="完成每个关卡来学习 Python，从基础到项目！" data-lang-en="Complete each lesson to learn Python, from basics to projects!">完成每个关卡来学习 Python，从基础到项目！</span>
        </p>
        <div class="chapter-list" id="chapter-list"></div>
      </div>

      <!-- Lesson Page -->
      <div class="page" id="page-lesson">
        <div class="lesson-container">
          <div class="lesson-topbar">
            <button class="back-btn" onclick="APP.navigateTo('courses')">←</button>
            <span class="lesson-title-bar" id="lesson-title">课程</span>
            <span class="lesson-xp-bar" id="lesson-xp-badge">+50 XP</span>
          </div>
          <div class="lesson-body">
            <!-- Instructions Panel (Left) -->
            <div class="lesson-instructions-panel" id="lesson-content">
              <p>加载中...</p>
            </div>

            <!-- Workspace Panel (Right) -->
            <div class="lesson-workspace-panel">
              <div class="workspace-header">
                <span class="lang-badge">Python</span>
                <span class="shortcut-hint">
                  <span data-lang-zh="Ctrl+Enter 运行" data-lang-en="Ctrl+Enter Run">Ctrl+Enter 运行</span>
                </span>
              </div>
              <div class="editor-wrapper">
                <div id="editor-container"></div>
              </div>

              <!-- Terminal Output -->
              <div class="output-terminal">
                <div class="terminal-header">
                  <span class="terminal-dot dot-red"></span>
                  <span class="terminal-dot dot-yellow"></span>
                  <span class="terminal-dot dot-green"></span>
                  <span class="terminal-label">▶ Console / 控制台</span>
                </div>
                <div class="terminal-content" id="lesson-output">▶ 点击"运行"查看输出</div>
              </div>

              <!-- Actions -->
              <div class="lesson-actions">
                <div class="left-buttons">
                  <button class="btn btn-pixel btn-ghost" id="btn-prev" style="display:none">← <span data-lang-zh="上一关" data-lang-en="Prev">上一关</span></button>
                  <button class="btn btn-pixel btn-hint" id="btn-hint" onclick="APP.showHint()">💡 <span data-lang-zh="提示" data-lang-en="Hint">提示</span></button>
                </div>
                <div class="right-buttons">
                  <button class="btn btn-pixel btn-primary" onclick="APP.runCode()">▶ <span data-lang-zh="运行" data-lang-en="Run">运行</span></button>
                  <button class="btn btn-pixel btn-ghost" id="btn-next" style="display:none"><span data-lang-zh="下一关" data-lang-en="Next">下一关</span> →</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Achievements Page -->
      <div class="page" id="page-achievements">
        <h2 class="section-title">🏅 <span data-lang-zh="成就徽章" data-lang-en="Achievements">成就徽章</span></h2>
        <p style="color: var(--text-secondary); margin-bottom: 8px; font-size: 14px;">
          <span data-lang-zh="已获得" data-lang-en="Earned">已获得</span>: <strong id="badge-count">0 / 14</strong>
        </p>
        <div class="badges-grid" id="badges-grid"></div>
      </div>

      <!-- Settings Page -->
      <div class="page" id="page-settings">
        <h2 class="section-title">⚙️ <span data-lang-zh="设置" data-lang-en="Settings">设置</span></h2>
        <div id="settings-content"></div>
      </div>

    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="vendor/editor-bundle.js"></script>
  <script src="js/data.js"></script>
  <script src="js/gamification.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
